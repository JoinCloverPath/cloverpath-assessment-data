        }

            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #008208ff, #7bbc00ff);
            border-radius: 16px;
            margin-bottom: 40px;

        .cd-header h1 {

            margin-bottom: 10px;

        }

        .cd-header p {

            opacity: 0.95;
            color: #ffffff;
        }

        /* Progress Bar */

            border: 2px solid rgba(123, 188, 0, 0.25);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);

        .cd-progress-bar {
            height: 10px;
            background: rgba(0, 0, 0, 0.08);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .cd-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #008208ff, #7bbc00ff);

            color: #4a5568;
            font-size: 0.9rem;
            font-weight: 500;
        }

            line-height: 1.6;
            color: #2d3748;

        }

        .cd-likert-option input[type="radio"] {
            display: none;
        }

        .cd-likert-label {
            display: block;
            padding: 16px 12px;
            background: rgba(0, 0, 0, 0.02);
            border: 2px solid rgba(123, 188, 0, 0.25);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cd-likert-label:hover {
            background: rgba(123, 188, 0, 0.1);
            border-color: #7bbc00ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
        }

        .cd-likert-option input[type="radio"]:checked + .cd-likert-label {
            background: #008208ff;
            border-color: #008208ff;
            color: white;
            box-shadow: 0 4px 12px rgba(0, 130, 8, 0.3);
        }

        .cd-likert-value {
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .cd-likert-text {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        /* Navigation Buttons */
        .cd-nav-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .cd-btn {

            padding: 16px 30px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cd-btn-primary {
            background: #008208ff;
            color: white;
        }

        .cd-btn-primary:hover:not(:disabled) {
            background: #7bbc00ff;
            transform: translateY(-2px);
        }

        .cd-btn-secondary {
            background: rgba(255, 255, 255, 0.9);
            color: #2d3748;
            border: 2px solid rgba(123, 188, 0, 0.3);
        }

        .cd-btn-secondary:hover:not(:disabled) {
            background: rgba(123, 188, 0, 0.1);
            border-color: #7bbc00ff;
        }

        .cd-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .cd-results {
            display: none;
        }

        .cd-results.active {
            display: block;
        }

            border-radius: 16px;
            padding: 40px;
            margin-bottom: 40px;
            text-align: center;
        }

            font-size: 2rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .cd-composite-archetype p {
            font-size: 1.2rem;
            line-height: 1.6;
            opacity: 0.95;
        }

            font-size: 1.8rem;
            margin-bottom: 25px;
            color: #7bbc00ff;
            font-weight: 700;

            font-weight: 700;
            color: #7bbc00ff;
        }

        .cd-persona-score {

            color: white;

            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }

            color: #2d3748;
            font-weight: 500;
        }

        .cd-persona-description {

            line-height: 1.6;
            margin-bottom: 15px;

            font-size: 1rem;
            font-weight: 600;
        }

        }

        }
        
        .cd-persona-why {

        }

        /* Careers Section */

            margin-bottom: 40px;
        }

            padding: 20px;
            margin-bottom: 20px;

            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .cd-toggle-label {
            font-size: 1rem;
            color: #2d3748;
        }

        .cd-toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .cd-toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .cd-toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.2);
            transition: 0.4s;
            border-radius: 34px;
        }

        .cd-toggle-slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .cd-toggle-slider {
            background-color: #008208ff;
        }

        input:checked + .cd-toggle-slider:before {

        }

            border-radius: 12px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;

            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .cd-needs-exploration p {
            font-size: 1.1rem;
            line-height: 1.6;
            opacity: 0.95;

        /* Loading */
        .cd-loading {
            text-align: center;
            padding: 60px 20px;
        }
        
        .cd-loading p {
            color: #4a5568;
            font-size: 1.1rem;
        }

        .cd-spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #008208ff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: cd-spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes cd-spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .cd-module {
                padding: 20px 15px;
            }

            .cd-header h1 {
                font-size: 1.8rem;
            }

            .cd-header p {
                font-size: 1rem;
            }

            .cd-likert-scale {
                grid-template-columns: 1fr;
            }

            .cd-career-header {
                flex-direction: column;
            }

            .cd-career-score {
                text-align: left;
            }

            .cd-composite-archetype h2 {
                font-size: 1.5rem;
            }

            .cd-section-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="cd-module">
        <!-- Header -->
        <div class="cd-header">
            <h1>Career Diagnostic Assessment</h1>
            <p>Discover your career fit through performance-based evaluation</p>
        </div>

        <!-- Assessment Section -->
        <div id="cdAssessmentSection">
            <!-- Progress Bar -->
            <div class="cd-progress">
                <div class="cd-progress-bar">
                    <div class="cd-progress-fill" id="cdProgressFill"></div>
                </div>
                <div class="cd-progress-text" id="cdProgressText">Question 1 of 84</div>
            </div>

            <!-- Question Container -->
            <div id="cdQuestionContainer"></div>

            <!-- Navigation Buttons -->
            <div class="cd-nav-buttons">
                <button class="cd-btn cd-btn-secondary" id="cdPrevBtn">Previous</button>
                <button class="cd-btn cd-btn-primary" id="cdNextBtn" disabled>Next</button>
            </div>
        </div>

        <!-- Results Section -->
        <div id="cdResultsSection" class="cd-results">
            <div class="cd-loading" id="cdLoadingSpinner">
                <div class="cd-spinner"></div>
                <p>Analyzing your responses and calculating your career matches...</p>
            </div>

            <div id="cdResultsContent" class="hidden">
                <!-- Composite Archetype -->
                <div class="cd-composite-archetype" id="cdCompositeArchetype"></div>

                <!-- Top 3 Personas -->
                <div class="cd-personas-section">
                    <h2 class="cd-section-title">Your Top Career Personas</h2>
                    <div id="cdPersonasContainer"></div>
                </div>

                <!-- Top 10 Careers -->
                <div class="cd-careers-section">
                    <h2 class="cd-section-title">Your Top 10 Career Matches</h2>
                    
                    <!-- Enneagram Toggle -->
                    <div class="cd-enneagram-toggle">
                        <div class="cd-toggle-label">
                            <strong>Enneagram Overlay</strong> - Adjust rankings based on your personality type
                        </div>
                        <label class="cd-toggle-switch">
                            <input type="checkbox" id="cdEnneagramToggle">
                            <span class="cd-toggle-slider"></span>
                        </label>
                    </div>

                    <div id="cdCareersContainer"></div>
                </div>
            </div>
        </div>
    </div>

            function calculateResults() {
                // Step 1: Calculate construct scores
                const constructScores = calculateConstructScores();

                // Step 2: Determine construct flags (HIGH, MID, LOW)
                const constructFlags = determineConstructFlags(constructScores);

                // Step 3: Calculate personas
                const personas = calculatePersonas(constructFlags, constructScores);

                // Step 4: Calculate career fits
                const careers = calculateCareerFits(constructScores, constructFlags);

                // Step 5: Apply Fit Rules
                const careersWithRules = applyFitRules(careers, constructFlags);

                // Step 6: Sort and get top 10
                const top10Careers = careersWithRules
                    .sort((a, b) => b.Final_Fit - a.Final_Fit)
                    .slice(0, 10);

                // Step 7: Calculate Enneagram adjusted scores if type is set
                const enneagramCareers = enneagramType ? 
                    calculateEnneagramAdjusted(top10Careers, constructScores) : 
                    top10Careers;

                return {
                    constructScores,
                    constructFlags,
                    personas,
                    baselineCareers: top10Careers,
                    enneagramCareers: enneagramCareers,
                    needsExploration: personas.needsExploration
                };
            }

            function calculateConstructScores() {
                const scores = {};
                const constructs = [
                    'C1_Quant_Analytical', 'C2_Tech_Digital', 'C3_Creative_Storytelling',
                    'C4_Sales_Influence', 'C5a_Client_Service', 'C5b_Emotional_Care',
                    'C6_Operations_Detail', 'C7_Leadership_Ownership', 'C8_Pace_Ambiguity_Fit',
                    'C9_Interest_Biz_Finance', 'C10_Interest_Creative_Media', 'C11_Interest_Tech_Data_Eng',
                    'C12_Interest_People_Impact', 'C13_Creative_Production', 'C14_Entrepreneurial_Initiative',
                    'C15_Structured_Helping', 'C16_Legal_Contracts'
                ];

                const questions = ASSESSMENT_DATA.all_questions;

                constructs.forEach(construct => {
                    const constructQuestions = questions.filter(q => q.Construct === construct);
                    const numItems = constructQuestions.length;
                    const minRaw = 0;
                    const maxRaw = numItems * 4;

                    let rawScore = 0;
                    constructQuestions.forEach(q => {
                        rawScore += responses[q.ItemID] || 0;
                    });

                    const percentScore = maxRaw > 0 ? (rawScore / maxRaw) * 100 : 0;

                    scores[construct] = {
                        raw: rawScore,
                        percent: percentScore,
                        numItems: numItems
                    };
                });

                return scores;
            }

            function determineConstructFlags(scores) {
                const flags = {};

                Object.keys(scores).forEach(construct => {
                    const percent = scores[construct].percent;
                    
                    if (percent >= 66.67) {
                        flags[construct] = 'HIGH';
                    } else if (percent >= 33.33) {
                        flags[construct] = 'MID';
                    } else {
                        flags[construct] = 'LOW';
                    }
                });

                return flags;
            }

            function calculatePersonas(flags, scores) {
                const personaRules = ASSESSMENT_DATA.persona_rules;
                const personaDescriptions = ASSESSMENT_DATA.personas;
                
                const personaScores = [];

                personaRules.forEach(rule => {
                    let metCount = 0;
                    const ruleCount = [rule.Rule_1, rule.Rule_2, rule.Rule_3].filter(r => r && r !== 'NaN').length;

                    // Check each rule
                    [rule.Rule_1, rule.Rule_2, rule.Rule_3].forEach(ruleKey => {
                        if (ruleKey && ruleKey !== 'NaN') {
                            const constructKey = ruleKey.substring(0, ruleKey.lastIndexOf('_'));
                            const requiredFlag = ruleKey.split('_').pop();
                            if (flags[constructKey] === requiredFlag) {
                                metCount++;
                            }
                        }
                    });

                    // Check suppressors
                    let suppressed = false;
                    [rule.Suppressor_1, rule.Suppressor_2].forEach(suppressor => {
                        if (suppressor && suppressor !== 'NaN') {
                            const constructKey = suppressor.substring(0, suppressor.lastIndexOf('_'));
                            const requiredFlag = suppressor.split('_').pop();
                            if (flags[constructKey] === requiredFlag) {
                                suppressed = true;
                            }
                        }
                    });

                    if (suppressed) {
                        metCount = 0;
                    }

                    // Calculate persona score
                    const weight = rule.Weight || 3;
                    const personaScore = metCount * weight;

                    // Get construct tiebreak score
                    let tiebreakScore = 0;
                    Object.keys(scores).forEach(construct => {
                        tiebreakScore += scores[construct].percent;
                    });
                    tiebreakScore = tiebreakScore / Object.keys(scores).length / 100;

                    personaScores.push({
                        persona: rule.Persona,
                        score: personaScore,
                        metCount: metCount,
                        ruleCount: ruleCount,
                        tiebreak: tiebreakScore
                    });
                });

                // Sort by score, then tiebreak
                personaScores.sort((a, b) => {
                    if (b.score !== a.score) return b.score - a.score;
                    return b.tiebreak - a.tiebreak;
                });

                // Check if needs exploration
                const topScore = personaScores[0]?.score || 0;
                const needsExploration = topScore < 3 || personaScores.filter(p => p.score > 0).length < 2;

                // Get top 3 personas with descriptions
                const top3 = personaScores.slice(0, 3).map(ps => {
                    const description = personaDescriptions.find(pd => pd.Persona === ps.persona);
                    return {
                        ...ps,
                        ...description
                    };
                });

                return {
                    top3: top3,
                    all: personaScores,
                    needsExploration: needsExploration
                };
            }

            function calculateCareerFits(scores, flags) {
                const careers = ASSESSMENT_DATA.careers;
                const careerFits = [];

                careers.forEach(career => {
                    let baseFit = 0;
                    let totalWeight = 0;

                    // Calculate weighted fit based on construct scores
                    Object.keys(scores).forEach(construct => {
                        const weight = career[construct];
                        if (weight && !isNaN(weight)) {
                            baseFit += (scores[construct].percent / 100) * parseFloat(weight);
                            totalWeight += parseFloat(weight);
                        }
                    });

                    const finalFit = totalWeight > 0 ? (baseFit / totalWeight) * 100 : 0;

                    careerFits.push({
                        ...career,
                        Base_Fit: baseFit,
                        Final_Fit: finalFit,
                        Fit_Percent: Math.round(finalFit)
                    });
                });

                return careerFits;
            }

            function applyFitRules(careers, flags) {
                const fitRules = ASSESSMENT_DATA.fit_rules;

                careers.forEach(career => {
                    const applicableRule = fitRules.find(rule => 
                        rule.Subcluster_ID === career.Subcluster_ID
                    );

                    if (applicableRule) {
                        let ruleMet = true;

                        for (let i = 1; i <= 3; i++) {
                            const reqConstruct = applicableRule[`Req${i}_Construct`];
                            const reqFlag = applicableRule[`Req${i}_Flag`];
                            const reqExpected = applicableRule[`Req${i}_Expected`];

                            if (reqConstruct && reqConstruct !== 'NaN') {
                                const actualFlag = flags[reqConstruct];
                                
                                if (reqExpected === 1 && actualFlag !== reqFlag) {
                                    ruleMet = false;
                                    break;
                                } else if (reqExpected === 0 && actualFlag === reqFlag) {
                                    ruleMet = false;
                                    break;
                                }
                            }
                        }

                        if (ruleMet) {
                            const multiplier = applicableRule.Multiplier || 1;
                            career.Final_Fit *= multiplier;
                            career.Fit_Percent = Math.round(career.Final_Fit);
                            career.Rule_Applied = applicableRule.Reason;
                        }
                    }
                });

                return careers;
            }

            function calculateEnneagramAdjusted(careers, constructScores) {
                if (!enneagramType) return careers;

                const enneagramMods = ASSESSMENT_DATA.enneagram_modifiers;
                const modifiers = enneagramMods.find(m => m.Ennea_Type === parseInt(enneagramType));

                if (!modifiers) return careers;

                const adjustedCareers = careers.map(career => {
                    let adjustedFit = career.Final_Fit;
                    let newBaseFit = 0;
                    let totalWeight = 0;

                    Object.keys(constructScores).forEach(construct => {
                        const weight = career[construct];
                        if (weight && !isNaN(weight)) {
                            const modifier = modifiers[construct] || 0;
                            const adjustedPercent = Math.max(0, Math.min(100, 
                                constructScores[construct].percent + (modifier * 10)));
                            
                            newBaseFit += (adjustedPercent / 100) * parseFloat(weight);
                            totalWeight += parseFloat(weight);
                        }
                    });

                    adjustedFit = totalWeight > 0 ? (newBaseFit / totalWeight) * 100 : 0;

                    return {
                        ...career,
                        Final_Fit: adjustedFit,
                        Fit_Percent: Math.round(adjustedFit)
                    };
                });

                return adjustedCareers.sort((a, b) => b.Final_Fit - a.Final_Fit);
            }

            function generateCompositeArchetype(personas) {

                const traitList = traits.split(',').map(t => t.trim());

                const headline = `You're ${uniqueTraits.join(', ').toLowerCase()}`;
                
                const topPersona = top3[0];
                const description = `${topPersona['Simple Summary']} You thrive in environments that value ${modes.toLowerCase()}.`;

                return {
                    headline: headline,
                    description: description
                };
            }

                            <div class="cd-persona-summary">${persona['Simple Summary'] || ''}</div>
                            <div class="cd-persona-description">${persona['Detailed Summary'] || ''}</div>
                            <div class="cd-persona-careers">
                                <h4>Top Careers for This Persona:</h4>
                                <p>${persona['TopCareers to Consider'] || ''}</p>
                                <p class="cd-persona-why">
                                    <em>${persona['Why these Career Fit'] || ''}</em>
                                </p>
                            </div>
                        </div>
                    `).join('');
                }

                // Display baseline careers
                displayCareers(baselineCareers);

                // Hide loading, show content
                document.getElementById('cdLoadingSpinner').classList.add('hidden');
                document.getElementById('cdResultsContent').classList.remove('hidden');
            }

            function displayCareers(careers) {
                const careersContainer = document.getElementById('cdCareersContainer');
                
                careersContainer.innerHTML = careers.map((career, index) => `
                    <div class="cd-career-card">
                        <div class="cd-career-header">
                            <div class="cd-career-rank">#${index + 1}</div>
                            <div class="cd-career-info">
                                <div class="cd-career-title">${career.Subcluster_Name}</div>
                                <div class="cd-career-cluster">${career.CareerCluster}</div>
                            </div>
                            <div class="cd-career-score">
                                <div class="cd-career-fit-percent">${career.Fit_Percent}%</div>
                                <div class="cd-career-fit-label">Match</div>
                            </div>
                        </div>
                        ${career.Rule_Applied ? `
                            <div class="cd-career-description">
                                <strong>Why this fits:</strong> ${career.Rule_Applied}
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            }

            function toggleEnneagram() {
                const isEnabled = document.getElementById('cdEnneagramToggle').checked;
                
                if (isEnabled && !enneagramType) {
                    const type = prompt('Enter your Enneagram type (1-9):');
                    if (type && parseInt(type) >= 1 && parseInt(type) <= 9) {
                        enneagramType = type;
                        
                        const enneagramCareers = calculateEnneagramAdjusted(
                            assessmentResults.baselineCareers,
                            assessmentResults.constructScores
                        );
                        assessmentResults.enneagramCareers = enneagramCareers;
                        displayCareers(enneagramCareers);
                    } else {
                        document.getElementById('cdEnneagramToggle').checked = false;
                        alert('Please enter a valid Enneagram type (1-9)');
                    }
                } else if (isEnabled) {
                    displayCareers(assessmentResults.enneagramCareers);
                } else {
                    displayCareers(assessmentResults.baselineCareers);
                }
            }

            async function saveResults() {
                if (!currentUser) {
                    console.warn('No user authenticated, skipping save');
                    return;
                }

                try {
                    const { error: responsesError } = await supabaseClient
                        .from('career_diagnostic_responses')
                        .insert({
                            user_id: currentUser.id,
                            responses: responses,
                            timestamp: new Date().toISOString()
                        });

                    if (responsesError) throw responsesError;

                    const { error: resultsError } = await supabaseClient
                        .from('career_diagnostic_results')
                        .insert({
                            user_id: currentUser.id,
                            construct_scores: assessmentResults.constructScores,
                            construct_flags: assessmentResults.constructFlags,
                            personas: assessmentResults.personas.top3.map(p => ({
                                name: p.persona,
                                score: p.score
                            })),
                            baseline_careers: assessmentResults.baselineCareers.map(c => ({
                                name: c.Subcluster_Name,
                                cluster: c.CareerCluster,
                                fit_percent: c.Fit_Percent
                            })),
                            needs_exploration: assessmentResults.needsExploration,
                            timestamp: new Date().toISOString()
                        });

                    if (resultsError) throw resultsError;

                    console.log('Results saved successfully');
                } catch (error) {
                    console.error('Error saving results:', error);
                }
            }
        })();
    </script>
</body>
</html>
